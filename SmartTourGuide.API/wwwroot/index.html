function ui(lang,key,values={}){
 const keyLang=String(lang||'vi').toLowerCase();
 const result=(uiStrings[keyLang]||uiStrings.vi)[key]??uiStrings.vi[key]??key;
 if(typeof result!=='string')return result;
 return result.replace(/\{(\w+)\}/g,(_,name)=>String(values[name]??''));
}
// Keep language selector labels fixed in English for easier scanning.
function languageNameList(){return ['Vietnamese','English','Chinese (Simplified)','Cantonese (Hong Kong)','Spanish']}
let cachedTourCode = null;
let cachedTourData = null;
let guestSession = null;
let guestHeartbeatTimer = null;
let lastGuestInteraction = Date.now();
let simulationMap = null;
let simulationMarker = null;

for (const eventName of ['pointerdown', 'touchstart', 'keydown', 'scroll']) {
 document.addEventListener(eventName, () => { lastGuestInteraction = Date.now(); }, { passive: true });
}

function startGuestTracking(sessionId, deviceId) {
 if (guestHeartbeatTimer) clearInterval(guestHeartbeatTimer);
 lastGuestInteraction = Date.now();
 guestSession = { sessionId, deviceId };
 const heartbeat = () => {
  if (!guestSession || document.visibilityState !== 'visible') return;
  const audioPlaying = [...document.querySelectorAll('audio')].some(audio => !audio.paused && !audio.ended);
  if (Date.now() - lastGuestInteraction > 120000 && !audioPlaying) return;
  fetch(`/api/public/tours/sessions/${encodeURIComponent(guestSession.sessionId)}/heartbeat`, {
   method: 'POST', headers: { 'Content-Type': 'application/json' },
   body: JSON.stringify({ deviceId: guestSession.deviceId }), keepalive: true
  }).catch(() => {});
 };
 heartbeat();
 guestHeartbeatTimer = setInterval(heartbeat, 20000);
}

document.addEventListener('visibilitychange', () => {
 if (document.visibilityState === 'visible' && guestSession) {
  fetch(`/api/public/tours/sessions/${encodeURIComponent(guestSession.sessionId)}/heartbeat`, {
   method: 'POST', headers: { 'Content-Type': 'application/json' },
   body: JSON.stringify({ deviceId: guestSession.deviceId }), keepalive: true
  }).catch(() => {});
 }
});

window.addEventListener('pagehide', () => {
 if (!guestSession) return;
 const payload = new Blob([JSON.stringify({ deviceId: guestSession.deviceId })], { type: 'application/json' });
 navigator.sendBeacon(`/api/public/tours/sessions/${encodeURIComponent(guestSession.sessionId)}/end`, payload);
});

const speechVoiceConfig = {
 vi:    { label: 'tiếng Việt', locale: 'vi-VN', aliases: ['vi-vn', 'vi'] },
 en:    { label: 'tiếng Anh', locale: 'en-US', aliases: ['en-us', 'en-gb', 'en'] },
 'zh-CN': { label: 'tiếng Trung phổ thông (Trung Quốc đại lục)', locale: 'zh-CN', aliases: ['zh-cn', 'zh-hans-cn', 'cmn-hans-cn', 'cmn-cn', 'zh-hans'] },
 'zh-HK': { label: 'tiếng Quảng Đông (Hồng Kông)', locale: 'zh-HK', aliases: ['zh-hk', 'zh-hant-hk', 'yue-hk', 'yue'] },
 es:     { label: 'tiếng Tây Ban Nha', locale: 'es-ES', aliases: ['es-es', 'es-mx', 'es'] }
};
let cachedSpeechVoices = [];
function normalizeVoiceLocale(locale) {
 return String(locale || '').replace(/_/g, '-').replace(/#.*$/, '').toLowerCase();
}
function refreshSpeechVoices() {
 try {
  const voices = window.speechSynthesis.getVoices();
  if (voices && voices.length) cachedSpeechVoices = voices;
 } catch (_) { /* Một số trình duyệt di động có thể chưa sẵn sàng liệt kê giọng đọc. */ }
}
if ('speechSynthesis' in window) {
 refreshSpeechVoices();
 if (typeof window.speechSynthesis.addEventListener === 'function') {
  window.speechSynthesis.addEventListener('voiceschanged', refreshSpeechVoices);
 } else {
  window.speechSynthesis.onvoiceschanged = refreshSpeechVoices;
 }
}
function findSpeechVoice(lang) {
 refreshSpeechVoices();
 const config = speechVoiceConfig[lang] || speechVoiceConfig.vi;
 const voices = cachedSpeechVoices;
 if (!voices.length) return null;
 // Ưu tiên locale khớp chính xác. Đặc biệt không lấy giọng zh-HK làm phương án dự phòng cho zh-CN.
 for (const alias of config.aliases) {
  const exact = voices.find(v => normalizeVoiceLocale(v.lang) === alias);
  if (exact) return exact;
 }
 // Chấp nhận biến thể vùng của cùng locale, nhưng vẫn giữ riêng hai nhóm Trung Quốc đại lục/Hồng Kông.
 for (const alias of config.aliases) {
  const regional = voices.find(v => normalizeVoiceLocale(v.lang).startsWith(alias + '-'));
  if (regional) return regional;
 }
 return null;
}
function setVoiceStatus(message) {
 const el = document.querySelector('#voice-status') || document.querySelector('#detail-voice-status');
 if (el) el.textContent = message;
}
function speak(text, lang) {
 if (!text) return;
 if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
  setVoiceStatus(ui(lang,'ttsUnsupported'));
  return;
 }
 const config = speechVoiceConfig[lang] || speechVoiceConfig.vi;
 const voiceLanguage=ui(lang,'voice');
 const voice = findSpeechVoice(lang);
 const isChineseVariant = lang === 'zh-CN' || lang === 'zh-HK';
 if (!voice && isChineseVariant) {
  const availableChinese = cachedSpeechVoices
   .filter(v => /^(zh|cmn|yue)(-|$)/i.test(normalizeVoiceLocale(v.lang)))
   .map(v => `${v.name} (${v.lang})`);
  const list = availableChinese.length
   ? ui(lang,'availableVoices',{voices:availableChinese.join(', ')})
   : ui(lang,'noChineseVoice');
  setVoiceStatus(ui(lang,'voiceMissing',{language:voiceLanguage,locale:config.locale})+list+ui(lang,'installVoice'));
  return;
 }
 window.speechSynthesis.cancel();
 const utterance = new SpeechSynthesisUtterance(text);
 utterance.lang = config.locale;
 if (voice) utterance.voice = voice;
 utterance.onstart = () => setVoiceStatus(voice
  ? ui(lang,'voiceUsing',{name:voice.name,locale:voice.lang})
  : ui(lang,'voiceRequested',{language:voiceLanguage,locale:config.locale}));
 utterance.onerror = event => setVoiceStatus(ui(lang,'voiceError',{error:event.error||'speech error'}));
 window.speechSynthesis.speak(utterance);
}

async function loadTour(code,lang='vi'){
 const section=document.querySelector('#tour'), status=document.querySelector('#status'), content=document.querySelector('#content');
 section.classList.remove('hidden');document.querySelector('#generator').classList.add('hidden');
 try{
  // Reuse the first response when changing language. This is required for SingleUse QR codes,
  // because their first successful API request deactivates the code.
  if(cachedTourCode===code && cachedTourData){renderTour(cachedTourData,code,lang);return;}
  status.textContent=ui(lang,'loading');
  let deviceId=localStorage.getItem('stg-guest-device-id');
  if(!deviceId){deviceId=window.crypto?.randomUUID?window.crypto.randomUUID():`guest-${Date.now()}-${Math.random().toString(36).slice(2)}`;localStorage.setItem('stg-guest-device-id',deviceId);}
  const response=await fetch(`/api/public/tours/qr/${encodeURIComponent(code)}?language=${encodeURIComponent(lang)}&deviceId=${encodeURIComponent(deviceId)}`);
  const data=await response.json();
  if(!response.ok)throw Error(response.status===404?ui(lang,'qrNotFound'):ui(lang,'loadError'));
  startGuestTracking(data.sessionId,deviceId);
  cachedTourCode=code;
  cachedTourData=data;
  renderTour(data,code,lang);
 }catch(e){status.textContent=e.message||ui(lang,'loadError');content.innerHTML='';}
}

function renderTour(data,code,lang){
 const section=document.querySelector('#tour'), status=document.querySelector('#status'), content=document.querySelector('#content');
 section.classList.remove('hidden');
 document.documentElement.lang=lang;
 document.title=ui(lang,'pageTitle');
 document.querySelector('h1').textContent=`🎧 ${ui(lang,'pageTitle')}`;
 const t=data.tour;
 const languageKey=String(lang).toLowerCase();
 const tourTranslations=t.translations||[];
 const tourFallback=tourTranslations.find(x=>String(x.languageCode).toLowerCase()==='vi');
 const selectedTourTranslation=tourTranslations.find(x=>String(x.languageCode).toLowerCase()===languageKey);
 const tourTranslation=selectedTourTranslation||(languageKey==='vi'?tourFallback:null);
 const tourName=tourTranslation?.name||(languageKey==='vi'?t.name:ui(lang,'tourName'));
 const tourDescription=tourTranslation?.description??(languageKey==='vi'?(t.description??''):ui(lang,'translationMissing'));
 const welcomeMessage=tourTranslation?.welcomeMessage??(languageKey==='vi'?(t.welcomeMessage??''):ui(lang,'translationMissing'));
 const locations=(t.locations||[]).map(l=>{
  const allTranslations=l.translations||[];
  const fallback=allTranslations.find(x=>String(x.languageCode).toLowerCase()==='vi');
  const translation=allTranslations.find(x=>String(x.languageCode).toLowerCase()===languageKey)||(languageKey==='vi'?fallback:null);
  return {...l,
   name:translation?.title||(languageKey==='vi'?l.name:`${ui(lang,'area')} ${l.displayOrder}`),
   description:translation?.description??(languageKey==='vi'?(l.description??''):ui(lang,'translationMissing')),
   narrationText:translation?.narrationText??(languageKey==='vi'?(l.narrationText??''):ui(lang,'noNarration')),
   audioUrl:translation?.audioUrl??(languageKey==='vi'?(l.audioUrl??''):'')
  };
 });
 status.textContent=ui(lang,'validQr');
 content.innerHTML=`<h2>${escapeHtml(tourName)}</h2><p>${escapeHtml(tourDescription)}</p><p>${escapeHtml(welcomeMessage)}</p><label>${ui(lang,'language')}</label><select id="language">${languages.map((x,i)=>`<option value="${x}" ${x===lang?'selected':''}>${languageNameList(lang)[i]}</option>`).join('')}</select><button id="welcome">🔊 ${ui(lang,'welcome')}</button><p id="voice-status" class="muted" role="status" aria-live="polite"></p><section class="location-map"><h2>${ui(lang,'gpsTitle')}</h2><p class="map-help">${ui(lang,'gpsHelp')}</p><div id="sim-map" aria-label="${ui(lang,'mapAria')}"></div><p id="map-status" class="map-status muted" role="status" aria-live="polite">${ui(lang,'loadingMap')}</p></section><h2>${ui(lang,'areas')}</h2><div id="locations"></div>`;
 document.querySelector('#welcome').onclick=()=>speak(welcomeMessage,lang);
 document.querySelector('#language').onchange=e=>loadTour(code,e.target.value);
 document.querySelector('#locations').innerHTML=locations.map(l=>`<article class="location"><h3>${escapeHtml(l.displayOrder+'. '+l.name)}</h3><p>${escapeHtml(l.description)}</p><button class="secondary narration">${ui(lang,'speak')}</button>${l.audioUrl?`<audio controls preload="none" src="${escapeHtml(l.audioUrl)}"></audio>`:`<p class="muted">${ui(lang,'noAudio')}</p>`}</article>`).join('');
 document.querySelectorAll('.narration').forEach((b,i)=>b.onclick=()=>speak(locations[i].narrationText,lang));
 renderSimulationMap(locations,lang,code);
 const requestedLocationId=new URLSearchParams(location.search).get('location');
 const requestedLocation=locations.find(x=>x.id===requestedLocationId);
 if(requestedLocation)openLocationDetail(requestedLocation,lang,code,false);
}

function distanceMeters(a,b){
 const radians=value=>value*Math.PI/180;
 const dLat=radians(b.latitude-a.latitude),dLon=radians(b.longitude-a.longitude);
 const lat1=radians(a.latitude),lat2=radians(b.latitude);
 const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
 return 6371000*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}

function renderSimulationMap(locations,lang,code){
 const status=document.querySelector('#map-status');
 const demoCoordinates=[[10.77160,106.67352],[10.77182,106.67343],[10.77195,106.67343],[10.77182,106.67360],[10.77169,106.67331]];
 const usable=locations.map((item,index)=>{
  const fallback=demoCoordinates[Math.max(0,Math.min(demoCoordinates.length-1,(Number(item.displayOrder)||index+1)-1))];
  const lat=Number(item.latitude),lng=Number(item.longitude);
  return {...item,latitude:Number.isFinite(lat)&&lat!==0?lat:fallback[0],longitude:Number.isFinite(lng)&&lng!==0?lng:fallback[1],triggerRadiusMeters:Number(item.triggerRadiusMeters)||12};
 });
 if(!window.L){status.textContent=ui(lang,'mapUnavailable');renderMapFallback(usable,lang,code);return;}
 if(simulationMap){simulationMap.remove();simulationMap=null;simulationMarker=null;}
 const center=[10.7718218,106.6734327];
 simulationMap=L.map('sim-map').setView(center,19);
 let loadedTiles=0;
 const tiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:21,attribution:'&copy; OpenStreetMap contributors'}).addTo(simulationMap);
 tiles.on('tileload',()=>loadedTiles++);
 setTimeout(()=>{if(loadedTiles===0&&document.querySelector('#sim-map')){status.textContent=ui(lang,'mapUnavailableShort');renderMapFallback(usable,lang,code);}},6000);
 const selectPosition=position=>{
  const chosen={latitude:position.lat,longitude:position.lng};
  if(simulationMarker)simulationMap.removeLayer(simulationMarker);
  simulationMarker=L.marker([position.lat,position.lng]).addTo(simulationMap).bindPopup(ui(lang,'simulatedPosition')).openPopup();
  const nearest=usable.map(location=>({location,distance:distanceMeters(chosen,{latitude:Number(location.latitude),longitude:Number(location.longitude)})})).sort((a,b)=>a.distance-b.distance)[0];
  const radius=Math.min(Number(nearest.location.triggerRadiusMeters)||12,12);
  if(nearest.distance<=radius){
   status.textContent=ui(lang,'selected',{name:nearest.location.name,distance:Math.round(nearest.distance)});
   openLocationDetail(nearest.location,lang,code,true);
  }else{
   status.textContent=`${ui(lang,'outsideRadius')} ${ui(lang,'nearest',{name:nearest.location.name,distance:Math.round(nearest.distance)})}`;
  }
 };
 usable.forEach(location=>{
  const point=[Number(location.latitude),Number(location.longitude)];
  const radius=Math.min(Number(location.triggerRadiusMeters)||12,12);
  L.circle(point,{radius,color:'#176b52',weight:2,fillColor:'#39a77f',fillOpacity:.13}).addTo(simulationMap);
  const marker=L.circleMarker(point,{radius:8,color:'#fff',weight:2,fillColor:'#176b52',fillOpacity:1}).addTo(simulationMap);
  marker.bindTooltip(`${location.displayOrder}. ${escapeHtml(location.name)}`);
  marker.on('click',()=>selectPosition({lat:point[0],lng:point[1]}));
 });
 simulationMap.on('click',event=>selectPosition(event.latlng));
 status.textContent=ui(lang,'tapMap');
 setTimeout(()=>simulationMap?.invalidateSize(),100);
}

function renderMapFallback(locations,lang,code){
 const mapElement=document.querySelector('#sim-map');
 if(!mapElement)return;
 if(simulationMap){simulationMap.remove();simulationMap=null;simulationMarker=null;}
 mapElement.innerHTML=`<div class="map-fallback"><strong>${ui(lang,'chooseArea')}</strong><div class="map-fallback-list">${locations.map((item,index)=>`<button type="button" data-location-index="${index}">📍 ${escapeHtml(item.name)}</button>`).join('')}</div><p class="muted small">${ui(lang,'coordinateNote')}</p></div>`;
 mapElement.querySelectorAll('[data-location-index]').forEach(button=>button.onclick=()=>openLocationDetail(locations[Number(button.dataset.locationIndex)],lang,code,true));
}

function openLocationDetail(locationData,lang,code,autoPlay){
 if(simulationMap){simulationMap.remove();simulationMap=null;simulationMarker=null;}
 const params=new URLSearchParams({code,language:lang,location:locationData.id});
 history.pushState({locationId:locationData.id},'',`${location.pathname}?${params.toString()}`);
 showLocationDetail(locationData,lang,code,autoPlay);
}

function showLocationDetail(locationData,lang,code,autoPlay){
 const content=document.querySelector('#content');
 const narration=locationData.narrationText||ui(lang,'noNarration');
 content.innerHTML=`<button id="back-to-map" class="secondary">${ui(lang,'back')}</button><article class="card"><p class="muted">${ui(lang,'area')} ${escapeHtml(String(locationData.displayOrder||''))}</p><h2>${escapeHtml(locationData.name)}</h2>${locationData.imageUrl?`<img src="${escapeHtml(locationData.imageUrl)}" alt="${escapeHtml(locationData.name)}" style="max-width:100%;border-radius:12px">`:''}<p>${escapeHtml(locationData.description)}</p><h3>${ui(lang,'narration')}</h3><p>${escapeHtml(narration)}</p>${locationData.audioUrl?`<audio id="location-audio" controls preload="auto" src="${escapeHtml(locationData.audioUrl)}"></audio>`:''}<p id="detail-voice-status" class="muted" role="status" aria-live="polite">${autoPlay?ui(lang,'autoplay'):ui(lang,'pressPlay')}</p><button id="replay-narration">${ui(lang,'speak')}</button></article>`;
 document.querySelector('#back-to-map').onclick=()=>{
  window.speechSynthesis?.cancel();
  const backParams=new URLSearchParams({code,language:lang});
  history.replaceState({},'',`${location.pathname}?${backParams.toString()}`);
  renderTour(cachedTourData,code,lang);
 };
 const playNarration=()=>{
  const audio=document.querySelector('#location-audio');
  const status=document.querySelector('#detail-voice-status');
  if(audio){
   audio.play().then(()=>{status.textContent=ui(lang,'playingAudio');}).catch(()=>{status.textContent=ui(lang,'audioFallback');speak(narration,lang);});
  }else{
   speak(narration,lang);
   status.textContent=ui(lang,'deviceReading');
  }
 };
 document.querySelector('#replay-narration').onclick=playNarration;
 if(autoPlay)playNarration();
}

function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

document.querySelector('#make').onclick=()=>{const code=document.querySelector('#code').value.trim();if(!code)return;const url=`${location.origin}/tour/${encodeURIComponent(code)}`;document.querySelector('#qrcode').innerHTML='';if(!window.QRCode){document.querySelector('#qrurl').textContent='Không tải được thư viện tạo QR. Hãy thử tải lại trang.';return}new QRCode(document.querySelector('#qrcode'),{text:url,width:220,height:220});document.querySelector('#qrurl').textContent=url};
const params = new URLSearchParams(location.search);
if (params.has('code')) {
  loadTour(params.get('code'), params.get('language') || 'vi');
} else {
  // Deferred scripts run before DOMContentLoaded. Create the default QR only after the page is ready.
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelector('#make').click();
  }, { once: true });
}
</script></body></html>
